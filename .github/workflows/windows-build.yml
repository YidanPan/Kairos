name: Windows build

on:
  push:
    branches: [codex/signpath-prep]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: '1.100.0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Set up Rust
        run: rustup toolchain install 1.100.0 --profile minimal --target x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        run: npm ci
      - name: Check frontend
        run: |
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
      - name: Test Rust backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows x64 installer
        run: npm run tauri build -- --ci --target x86_64-pc-windows-msvc
      - name: Upload installer for signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kairos-windows-x64-unsigned
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Kairos_*_x64-setup.exe
          if-no-files-found: error
